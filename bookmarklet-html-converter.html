<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ ブックマークレット ➔ 静的HTML コンバーター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #0f172a; color: #f8fafc; padding: 24px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 900px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px; }
  h1 { color: #38bdf8; font-size: 20px; font-weight: bold; }
  p { font-size: 13px; color: #94a3b8; line-height: 1.5; }
  textarea { width: 100%; height: 160px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #38bdf8; font-family: monospace; font-size: 12px; resize: vertical; }
  textarea:focus { outline: none; border-color: #38bdf8; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
  button { background: #0284c7; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #0369a1; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
  button.accent { background: #10b981; }
  button.accent:hover { background: #059669; }
  
  .result-area { display: none; flex-direction: column; gap: 12px; margin-top: 12px; border-top: 1px solid #334155; padding-top: 16px; }
  
  /* モーダル（ポップアップ）CSS */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
  .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 900px; height: 85vh; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7); gap: 12px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; }
  .modal-title { color: #38bdf8; font-size: 16px; font-weight: bold; }
  .close-btn { background: #334155; color: #f8fafc; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; }
  .close-btn:hover { background: #ef4444; }
  .iframe-container { width: 100%; flex: 1; background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<div class="card">
  <h1>🛠️ ブックマークレット ➔ 静的HTML コンバーター</h1>
  <p>ブックマークレットコードから <code>window.open</code> などの新規タブ生成ラッパーを除去し、単体ファイルとしてそのまま動作・公開できる「完全動的HTML」に変換します。</p>
  
  <textarea id="inputCode" placeholder="ここに javascript:(function(){...})(); を貼り付け"></textarea>
  
  <div class="btn-row">
    <button id="convertBtn">⚡ HTMLに変換・抽出</button>
    <button class="accent" id="reopenBtn" style="display:none;">👁️ プレビューを再表示</button>
    <button class="secondary" id="clearBtn">クリア</button>
  </div>

  <div class="result-area" id="resultArea">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:16px; color:#cbd5e1;">📄 抽出された単体HTMLコード（そのまま保存して使用可能）</h2>
      <button id="copyBtn" style="padding:6px 12px; font-size:12px;">📋 コードをコピー</button>
    </div>
    <textarea id="outputCode" style="height: 240px; color: #10b981;" readonly></textarea>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">👁️ 動作プレビュー（単体HTMLモード）</div>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <div class="iframe-container">
      <iframe id="previewFrame"></iframe>
    </div>
  </div>
</div>

<script>
var hasResult = false;

document.getElementById('convertBtn').addEventListener('click', function() {
  var rawCode = document.getElementById('inputCode').value.trim();
  if (!rawCode) {
    alert('コードを入力してください。');
    return;
  }

  // 1. 基本的なラッパー・接頭辞の除去
  var cleanCode = rawCode.replace(/^javascript:\s*/i, '').trim();

  // 2. タイトル文字列の抽出（d.title = '...' から取得）
  var titleMatch = cleanCode.match(/d\.title\s*=\s*['"]([^'"]+)['"]/);
  var docTitle = titleMatch ? titleMatch[1] : 'Web App';

  // 3. window.open や head/body 補完コードの除去・正規化
  // 以下の頻出イニシャライズ構文を通常ドキュメント用の定義に置換
  var processedCode = cleanCode;

  // window.open の除去
  processedCode = processedCode.replace(/var\s+w\s*=\s*window\.open\([^)]*\)\s*;\s*(?:if\s*\(!w\)\s*return\s*;)?/g, 'var w = window;');
  processedCode = processedCode.replace(/const\s+w\s*=\s*window\.open\([^)]*\)\s*;\s*(?:if\s*\(!w\)\s*return\s*;)?/g, 'var w = window;');
  
  // head/body 補完構文の簡素化（通常のHTML内ではすでに head/body が存在するため）
  processedCode = processedCode.replace(/var\s+head\s*=\s*d\.head[^;]+;\s*if\s*\(!d\.head\)[^;]+;/g, 'var head = d.head;');
  processedCode = processedCode.replace(/var\s+body\s*=\s*d\.body[^;]+;\s*if\s*\(!d\.body\)[^;]+;/g, 'var body = d.body;');
  processedCode = processedCode.replace(/const\s+head\s*=\s*d\.head[^;]+;\s*if\s*\(!d\.head\)[^;]+;/g, 'var head = d.head;');
  processedCode = processedCode.replace(/const\s+body\s*=\s*d\.body[^;]+;\s*if\s*\(!d\.body\)[^;]+;/g, 'var body = d.body;');

  // 末尾の void(0) などを除去
  processedCode = processedCode.replace(/;?\s*void\(0\);?$/i, ';');

  // 4. 単独で完結する完全なHTMLテンプレートを構築
  var finalHtml = '<!DOCTYPE html>\n' +
    '<html lang="ja">\n' +
    '<head>\n' +
    '  <meta charset="utf-8">\n' +
    '  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
    '  <title>' + docTitle + '</title>\n' +
    '</head>\n' +
    '<body>\n' +
    '  <script>\n' +
    '  // 単体HTML実行用に変換されたコード\n' +
    '  ' + processedCode + '\n' +
    '  <\/script>\n' +
    '</body>\n' +
    '</html>';

  // 5. プレビュー用 iframe に流し込み
  var iframe = document.getElementById('previewFrame');
  iframe.srcdoc = finalHtml;

  // 6. 出力欄に反映
  document.getElementById('outputCode').value = finalHtml;
  document.getElementById('resultArea').style.display = 'flex';
  document.getElementById('reopenBtn').style.display = 'inline-block';
  hasResult = true;

  openModal();
});

function openModal() {
  if (hasResult) {
    document.getElementById('modalOverlay').style.display = 'flex';
  }
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

document.getElementById('reopenBtn').addEventListener('click', openModal);
document.getElementById('closeModalBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) {
    closeModal();
  }
});

document.getElementById('copyBtn').addEventListener('click', function() {
  var out = document.getElementById('outputCode');
  out.select();
  document.execCommand('copy');
  alert('HTMLコードをコピーしました！');
});

document.getElementById('clearBtn').addEventListener('click', function() {
  document.getElementById('inputCode').value = '';
  document.getElementById('outputCode').value = '';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('reopenBtn').style.display = 'none';
  hasResult = false;
  closeModal();
});
</script>

</body>
</html>
